<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speaker script · The Memory-Bandwidth Wall</title>
</head>
<body>
<p><a href="deck.html?presenter">Open the speaker script and presenter controls</a></p>
<script>
const target = new URL("deck.html?presenter", location.href);
const theme = new URLSearchParams(location.search).get("theme");
if (theme === "light" || theme === "dark") target.searchParams.set("theme", theme);
target.hash = location.hash;
location.replace(target.href);
</script>
</body>
